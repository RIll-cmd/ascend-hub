<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zzz MultiMedia Wallpaper Engine</title>
    <link rel="stylesheet" href="style/styles.css">
    <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
    <div id="wallpaper">
        <div id="background-container">
            <img id="background-image" src="resource/image/zzz_background_crt_cutout_blur.png" alt="crt cutout scene">
            <div class="clock-container">
                <img id="clock-image" src="resource/image/clock.png" alt="clock image">
                <div id="clock">
                    <div class="digit" id="hour-tens"></div>
                    <div class="digit" id="hour-ones"></div>
                    <div class="separator"></div>
                    <div class="digit" id="minute-tens"></div>
                    <div class="digit" id="minute-ones"></div>
                </div>
            </div>
            <div class="calendar-container">
                <img id="calendar-image" src="resource/image/calendar.png" alt="calendar image">
                <div id="calendar">
                    <div id="calendar-year-month"></div>
                    <div id="calendar-header"></div>
                    <div id="calendar-grid"></div>
                </div>
            </div>
            <div class="tv-control-container">
                <input type="checkbox" id="tv-switch" class="tv-switch-checkbox" checked>
                <label for="tv-switch" class="switch-label"></label>
                <button id="switch-input"></button>
                <button id="switch-channel"></button>
                <button id="switch-play-state"></button>
            </div>
            <div class="tv-container-overlay" id="tv-container-overlay">
                <!-- Retro CRT YouTube Tuner HUD Trigger & Panel -->
                <button type="button" class="crt-yt-tuner-trigger" id="crt-yt-tuner-trigger" title="Open YouTube Search & Tuner">
                    <span class="tuner-radar-dot"></span>
                    <span class="tuner-trigger-text">🔍 YT SEARCH</span>
                </button>

                <div class="crt-yt-tuner-panel" id="crt-yt-tuner-panel" style="display: none;" aria-hidden="true">
                    <div class="tuner-header">
                        <div class="tuner-title-block">
                            <span class="tuner-radar-dot"></span>
                            <span class="tuner-title-text">CRT BROADCAST TUNER</span>
                            <span class="tuner-badge">CH-03 // YT</span>
                        </div>
                        <button type="button" class="tuner-close-btn" id="tuner-close-btn" title="Close Tuner">✕</button>
                    </div>

                    <div class="tuner-error-banner" id="tuner-error-banner" style="display: none;">
                        ⚠️ BROADCAST OFFLINE // SELECT A WORKING STREAM:
                    </div>

                    <form class="tuner-search-form" id="tuner-search-form">
                        <span class="tuner-prompt">&gt;</span>
                        <input 
                            type="text" 
                            id="tuner-search-input" 
                            placeholder="Search any song, artist, video or paste YT link..." 
                            autocomplete="off"
                            spellcheck="false"
                        />
                        <button type="submit" id="tuner-search-submit">TUNE</button>
                    </form>

                    <div class="tuner-pills-bar">
                        <button type="button" class="tuner-pill" data-query="Lofi Girl radio">☕ Lofi 24/7</button>
                        <button type="button" class="tuner-pill" data-query="Synthwave radio live">🌌 Synthwave</button>
                        <button type="button" class="tuner-pill" data-query="Cyberpunk 2077 radio">⚡ Cyberpunk</button>
                        <button type="button" class="tuner-pill" data-query="Zenless Zone Zero OST">🎮 ZZZ OST</button>
                        <button type="button" class="tuner-pill" data-query="Chillhop cafe live">🌧️ Chillhop</button>
                    </div>

                    <div class="tuner-results-container" id="tuner-results-container">
                        <div class="tuner-results-list" id="tuner-results-list">
                            <!-- Populated dynamically with live results -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="tv_container" id="tv-container">
                <img id="screen-highlight" src="resource/image/screen_hightlight.png" alt="screen-highlight">
                <!-- <img id="vignette" src="resource/image/crt-3.png" alt="vignette"> -->
                <div class="tv-screen" id="tv-screen-id">
                    <!-- <img id="vignette" src="resource/image/crt-3.png" alt="vignette"> -->
                    <div class="scanlines"></div>
                    <div class="scanlines-move"></div>
                    <div class="crt_effect" id="crt-container">
                        <div class="tv-info-overlay" id="tv-info-overlay">VIDEO</div>
                        <!-- <div class="vhs-info-overlay" id="vhs-info-overlay">PLAY</div> -->
                        <canvas id="noise-canvas" class="picture"></canvas>
                        <div class="tv-content-container" id="tv-content-container">
                            <!-- Your dynamic content goes here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <audio id="switch-channel-static" src="resource/sound/radio_static.mp3" preload="auto"></audio>
        <audio id="switch-channel-switch" src="resource/sound/light_switch.mp3" preload="auto"></audio>
        <!-- <audio id="soundEffect1" src="" preload="auto"></audio> -->
    </div>
