<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zzz MultiMedia Wallpaper Engine</title>
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="style/spotify-channel.css">
    <link rel="stylesheet" href="style/weather-channel.css">
    <link rel="stylesheet" href="style/channel-ui.css">
</head>

<body>
    <div id="wallpaper">
        <div id="background-container">
            <img id="background-image" src="resource/image/zzz_background_crt_cutout_blur.png" alt="crt cutout scene">
            <div class="clock-container">
                <img id="clock-image" src="resource/image/clock.png" alt="clock image">
                <div id="clock">
                    <div class="digit" id="hour-tens"></div>
                    <div class="digit" id="hour-ones"></div>
                    <div class="separator"></div>
                    <div class="digit" id="minute-tens"></div>
                    <div class="digit" id="minute-ones"></div>
                </div>
            </div>
            <div class="calendar-container">
                <img id="calendar-image" src="resource/image/calendar.png" alt="calendar image">
                <div id="calendar">
                    <div id="calendar-year-month"></div>
                    <div id="calendar-header"></div>
                    <div id="calendar-grid"></div>
                </div>
            </div>
            <div class="tv-control-container">
                <input type="checkbox" id="tv-switch" class="tv-switch-checkbox" checked>
                <label for="tv-switch" class="switch-label"></label>
                <button id="switch-input"></button>
                <button id="switch-channel"></button>
                <button id="switch-play-state"></button>
            </div>
            <div class="tv-container-overlay" id="tv-container-overlay">
                <button id="crt-yt-tuner-trigger" class="tv-broadcast-trigger" type="button" hidden>Choose video</button>
                <section id="yt-channel-slate" class="tv-broadcast-slate" hidden aria-live="polite">
                    <span class="tv-broadcast-tag">YouTube</span><h2>Broadcast unavailable</h2>
                    <p id="yt-channel-reason">This video cannot play on this TV.</p>
                    <div class="tv-broadcast-actions"><button id="yt-choose-video" type="button">Choose video</button><button id="yt-retry-video" type="button">Try again</button></div>
                    <button id="yt-open-external" class="tv-broadcast-link" type="button">Open on YouTube</button>
                </section>
                <section id="crt-yt-tuner-panel" class="tv-broadcast-picker" hidden aria-label="Choose YouTube video">
                    <header><span class="tv-broadcast-tag">YouTube</span><button id="tuner-close-btn" type="button">Back</button></header>
                    <form id="tuner-search-form"><label for="tuner-search-input" class="tv-broadcast-sr">Search title or paste a YouTube link</label><input id="tuner-search-input" type="search" placeholder="Search title or paste link" autocomplete="off"><button type="submit">Tune</button></form>
                    <p id="tuner-error-banner" class="tv-broadcast-caption" hidden aria-live="polite"></p>
                    <div id="tuner-results-list" class="tv-broadcast-results" aria-live="polite"></div>
                </section>
            </div>
            <div class="tv_container" id="tv-container">
                <img id="screen-highlight" src="resource/image/screen_hightlight.png" alt="screen-highlight">
                <!-- <img id="vignette" src="resource/image/crt-3.png" alt="vignette"> -->
                <div class="tv-screen" id="tv-screen-id">
                    <!-- <img id="vignette" src="resource/image/crt-3.png" alt="vignette"> -->
                    <div class="scanlines"></div>
                    <div class="scanlines-move"></div>
                    <div class="crt_effect" id="crt-container">
                        <div class="tv-info-overlay" id="tv-info-overlay">VIDEO</div>
                        <!-- <div class="vhs-info-overlay" id="vhs-info-overlay">PLAY</div> -->
                        <canvas id="noise-canvas" class="picture"></canvas>
                        <div class="tv-content-container" id="tv-content-container">
                            <!-- Your dynamic content goes here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <audio id="switch-channel-static" src="resource/sound/radio_static.mp3" preload="auto"></audio>
        <audio id="switch-channel-switch" src="resource/sound/light_switch.mp3" preload="auto"></audio>
        <!-- <audio id="soundEffect1" src="" preload="auto"></audio> -->
    </div>
